name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      # Dogfood: the tool must flag the demo plan and exit non-zero, and its JSON must name
      # the three findings. A tool whose own example does not trip it is decoration.
      - name: Dogfood the demo plan
        shell: bash
        run: |
          set +e
          python -m entraform examples/demo-plan.json --no-color
          code=$?
          test "$code" = "1" || { echo "demo plan should exit 1, got $code"; exit 1; }
          # entraform exits 1 on findings; capture to a file rather than pipe, so bash's
          # pipefail does not read that intended non-zero exit as a step failure.
          python -m entraform examples/demo-plan.json -f json > findings.json || true
          set -e
          python -c "import json; d=json.load(open('findings.json')); ids={f['rule_id'] for f in d['findings']}; assert {'ENT001','ENT002','ENT004'} <= ids, ids; print('dogfood ok:', sorted(ids))"

  sarif-selfcheck:
    # entraform's own SARIF must be ingestible by GitHub code scanning. We dogfood our own
    # Security tab: if the uploader rejects our SARIF, this job fails.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m entraform examples/demo-plan.json -f sarif > entraform.sarif || true
      - name: Validate SARIF is well-formed
        run: |
          python -c "import json; d=json.load(open('entraform.sarif')); assert d['version']=='2.1.0'; assert d['runs'][0]['results']; print('SARIF ok:', len(d['runs'][0]['results']), 'results')"
      - name: Upload to code scanning (proves it ingests)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: entraform.sarif
          category: entraform-selfcheck
